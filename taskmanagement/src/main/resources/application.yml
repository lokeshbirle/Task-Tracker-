server:
  port: 8080

spring:
  application:
    name: task-management-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taskmanagement}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-min-256-bits-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}      # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.taskmanagement: DEBUG
    org.springframework.security: INFO